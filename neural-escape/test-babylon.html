<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BabylonJS Test Scene</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #f0f3ff;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #renderCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(10, 14, 22, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 10px 12px;
        max-width: min(92vw, 620px);
        line-height: 1.4;
      }

      .ok {
        color: #52d273;
      }

      .ko {
        color: #ff5f73;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div class="hud">
      <div><strong>BabylonJS Test</strong></div>
      <div>Mouse: rotate camera | Wheel: zoom | Drag right click: pan</div>
      <div id="status"></div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script type="module" src="./src/basicTest.js"></script>
  </body>
</html>
