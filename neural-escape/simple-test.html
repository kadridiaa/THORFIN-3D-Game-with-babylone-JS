<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Escape - Simple Test</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9fd6ff;
        font-family: Arial, sans-serif;
      }

      #renderCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        color: #133018;
        font-size: 14px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div class="hud">
      <strong>Simple Test</strong><br />
      Maintenir Z ou W = marche<br />
      Click souris = bouger la camera
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script type="module" src="./src/simpleTest.js"></script>
  </body>
</html>
